{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <a class="masthead__brand" href="{{ base_path }}/">
      <span class="masthead__title">{{ site.title | escape }}</span>
      <span class="masthead__focus">{{ site.masthead_focus | escape }}</span>
    </a>
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item--sm"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
